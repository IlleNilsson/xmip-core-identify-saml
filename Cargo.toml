[package]
name = "xmip-core-identify-saml"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-identify-saml"
description = "Identify by saml: reads a SAML 2.0 assertion's subject and issuer, unverified, from a posted response or from the content, with the assertion riding as proof for the second gate. A xmip-core-identify technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The mechanism is xmip-core's; the Message is the
# Foundation's, for the message layer this mechanism also travels on.
identify = { workspace = true }
xcore = { workspace = true }
message = { workspace = true }
# The assertion read by the estate's one XML reader (`codec::xml::tree`).
codec = { workspace = true }
# The names the transport writes on the arrival (context::property), and
# the context a Message is built over.
context = { workspace = true }

[dev-dependencies]
# The Stream a Message is built over, for the tests only.
stream = { workspace = true }

[lints]
workspace = true
